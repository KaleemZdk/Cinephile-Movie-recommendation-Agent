<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinephile</title>
  <meta name="description" content="Cinephile is an AI assistant for movie and TV recommendations. Chat, discover, and keep track of what you love.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e3b341'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%231b1403'/%3E%3C/svg%3E">
  <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/chat.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#/chat" aria-label="Cinephile home">
          <span class="brand-mark" id="brandMark"></span>
          Cinephile
        </a>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary btn-block" id="newChat" type="button">New chat</button>
      </div>

      <nav class="nav" aria-label="Main">
        <a class="nav-link" href="#/discover" data-nav="discover" id="navDiscover"></a>
        <a class="nav-link" href="#/favorites" data-nav="favorites" id="navFavorites"></a>
        <a class="nav-link" href="#/watching" data-nav="watching" id="navWatching"></a>
        <a class="nav-link" href="#/reviews" data-nav="reviews" id="navReviews"></a>
      </nav>

      <section class="threads" aria-label="Chats">
        <div class="threads-head"><h2>Chats</h2></div>
        <div class="threads-search">
          <label class="sr-only" for="threadSearch">Search chats</label>
          <input class="input" id="threadSearch" type="search" placeholder="Search chats" autocomplete="off">
        </div>
        <div class="threads-list" id="threadList" role="list"></div>
      </section>

      <div class="sidebar-foot">
        <a class="nav-link" href="#/settings" data-nav="settings" id="navSettings"></a>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme"></button>
      </div>
    </aside>

    <div class="scrim" id="sidebarScrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"></button>
        <h1 id="pageTitle">Cinephile</h1>
        <span class="topbar-spacer"></span>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Title details">
    <div class="drawer-head">
      <span>Details</span>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="Close details"></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="scrim" id="drawerScrim"></div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="/assets/js/shell.js"></script>
</body>
</html>
